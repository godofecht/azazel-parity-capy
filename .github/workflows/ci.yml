name: parity
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  azazel:
    name: azazel builds capy's backend (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Install CUE
        run: |
          curl -sL "https://github.com/cue-lang/cue/releases/download/v0.11.1/cue_v0.11.1_darwin_arm64.tar.gz" -o /tmp/cue.tgz
          sudo tar -xzf /tmp/cue.tgz -C /usr/local/bin cue
      - name: Stage capy source
        run: ./azazel/fetch.sh
      - name: Build capy backend via azazel (CUE model)
        working-directory: azazel
        run: |
          sh gen_build_spec.sh
          time zig build
          test -f zig-out/bin/probe && echo "OK: capy backend compiled"
  zaza:
    name: zaza builds capy's backend (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Stage capy source
        run: ./zaza/fetch.sh
      - name: Build capy backend via zaza
        working-directory: zaza
        run: |
          time zig build probe
          test -f zig-out/bin/capy_probe && echo "OK: capy backend compiled"
